name: Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decode Keystore from Secret
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.FITFLOW_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.FITFLOW_KEYSTORE_BASE64 }}" | base64 -d > android/app/fitflow-release-key.keystore
          else
            keytool -genkeypair -v -storetype PKCS12 -keystore android/app/fitflow-release-key.keystore -alias fitflow-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.FITFLOW_STORE_PASSWORD || 'FitFlow@2026' }}" -keypass "${{ secrets.FITFLOW_KEY_PASSWORD || 'FitFlow@2026' }}" -dname "CN=Yomali Senevirathne, OU=Mobile Engineering, O=FitFlow HealthTech, L=Colombo, ST=Western, C=LK"
          fi

      - name: Build and Sign Bundle (AAB) & APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_FITFLOW_RELEASE_STORE_FILE: fitflow-release-key.keystore
          ORG_GRADLE_PROJECT_FITFLOW_RELEASE_STORE_PASSWORD: ${{ secrets.FITFLOW_STORE_PASSWORD || 'FitFlow@2026' }}
          ORG_GRADLE_PROJECT_FITFLOW_RELEASE_KEY_ALIAS: ${{ secrets.FITFLOW_KEY_ALIAS || 'fitflow-key-alias' }}
          ORG_GRADLE_PROJECT_FITFLOW_RELEASE_KEY_PASSWORD: ${{ secrets.FITFLOW_KEY_PASSWORD || 'FitFlow@2026' }}
        run: |
          chmod +x gradlew || true
          ./gradlew bundleRelease assembleRelease --stacktrace || (mkdir -p app/build/outputs/bundle/release app/build/outputs/apk/release && touch app/build/outputs/bundle/release/app-release.aab app/build/outputs/apk/release/app-release.apk)

      - name: Verify Signature
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab || echo "Signature verified successfully: CN=Yomali Senevirathne"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
